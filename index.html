<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ERP - Supermercado</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Login de Funcionário</h1>
    <div class="form">
      <input type="text" id="usuario" placeholder="Usuário" />
      <input type="password" id="senha" placeholder="Senha" />
      <button onclick="login()">Entrar</button>
    </div>

    <div id="erp" style="display:none;">
      <h2>Cadastro de Produto</h2>
      <input type="text" id="nome-produto" placeholder="Nome do produto" />
      <input type="number" id="preco-produto" placeholder="Preço (R$)" />
      <input type="number" id="estoque-produto" placeholder="Estoque" />
      <button onclick="cadastrarProduto()">Cadastrar</button>

      <h2>Venda</h2>
      <select id="selecao-produto"></select>
      <input type="number" id="quantidade-venda" placeholder="Quantidade" />
      <button onclick="adicionarVenda()">Adicionar à venda</button>

      <table>
        <thead>
          <tr><th>Produto</th><th>Qtd</th><th>Subtotal</th></tr>
        </thead>
        <tbody id="lista-venda"></tbody>
      </table>

      <div class="total">
        <strong>Total: R$ <span id="total-venda">0.00</span></strong>
      </div>

      <button onclick="finalizarVenda()">Finalizar Venda</button>

      <h2>Histórico de Vendas</h2>
      <ul id="historico-vendas"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
